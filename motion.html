<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#030303;color:white;font:14px 'Segoe UI Variable','Segoe UI',Arial,sans-serif}.panel{border:1px solid #5e5e5e;border-radius:0 0 38px 0;padding:20px 22px;background:#080808;height:430px}h3{margin:4px 0 8px;font-size:22px;letter-spacing:-.025em}.kind{color:#00e5c0;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.step{color:#ddd;background:#4e4e4e;padding:7px 12px;border-radius:20px;font-size:12px;white-space:nowrap}.readout{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px}.readout strong{font-variant-numeric:tabular-nums;color:#fff}.key{display:inline-block;width:17px;height:3px;vertical-align:middle;margin-right:6px}svg{display:block;width:100%;height:170px}.controls{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}button,select{background:#626262;border:1px solid #999;color:white;border-radius:3px;padding:7px 13px;font:inherit;cursor:pointer}button:first-child{background:#00cdb2;color:#001c17;border:1px solid #00e5c0;font-weight:700}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}input[type=range]{width:100%;accent-color:#00e5c0;margin:4px 0}input[type=checkbox]{accent-color:#00e5c0}label{font-size:11px;color:#ddd}.status{font-size:11px;color:#b8b8b8;margin-top:10px}.step-labels{display:flex;justify-content:space-between;color:#aaa;font-size:10px}@media(max-width:550px){.panel{padding:16px 12px}h3{font-size:18px}.readout{gap:10px}.controls{gap:8px}button,select{padding:6px 9px}.step{font-size:10px}svg{height:150px}}
</style><section class="panel" aria-label="Interactive data replay"><div class="kind" id="kind"></div><div class="top"><h3 id="title"></h3><span class="step" id="step"></span></div><div class="readout" id="readout"></div><svg id="chart" viewBox="0 0 800 205" role="img" aria-label="Progressive replay chart"></svg><input id="scrub" type="range" min="0" step="1" value="0" aria-label="Replay step"><div class="step-labels"><span id="first"></span><span id="last"></span></div><div class="controls"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button><label>Speed <select id="speed" aria-label="Replay speed"><option value="850">0.5×</option><option value="450" selected>1×</option><option value="180">2×</option></select></label><label><input id="reduce" type="checkbox"> Reduced motion</label></div><div class="status" id="status" role="status">Paused. Drag the timeline or press Play. Replay does not change the model.</div></section><script>
const data=__DATA__;const colors=['#00e5c0','#d7d7d7','#009d8e','#939393','#00a4ef','#7fba00'];const el=id=>document.getElementById(id);let step=0,timer=null;const n=data.labels.length,entries=Object.entries(data.series),all=entries.flatMap(([,v])=>v);let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo||1)*.13;lo-=pad;hi+=pad;const X=i=>54+i*728/Math.max(n-1,1),Y=v=>177-(v-lo)/(hi-lo)*151;
el('title').textContent=data.title;el('kind').textContent=data.kind;el('scrub').max=n-1;el('first').textContent=data.labels[0];el('last').textContent=data.labels[n-1];el('reduce').checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stop(){clearTimeout(timer);timer=null;el('play').textContent='Play';el('play').setAttribute('aria-pressed','false')}
function draw(){el('scrub').value=step;el('step').textContent=data.labels[step];el('readout').replaceChildren();let svg='';for(let i=0;i<4;i++){let value=lo+(hi-lo)*i/3,y=Y(value);svg+=`<line x1="54" x2="782" y1="${y}" y2="${y}" stroke="#303030"/><text x="2" y="${y+4}" fill="#aaa" font-size="10">${value.toFixed(2)}</text>`}
entries.forEach(([name,values],j)=>{const color=colors[j%colors.length],pts=values.map((v,i)=>`${X(i)},${Y(v)}`);svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#444" stroke-width="1" opacity=".55"/><polyline points="${pts.slice(0,step+1).join(' ')}" fill="none" stroke="${color}" stroke-width="3"/><circle cx="${X(step)}" cy="${Y(values[step])}" r="5" fill="${color}" stroke="white" stroke-width="1"/>`;const span=document.createElement('span'),key=document.createElement('i'),label=document.createTextNode(name+' '),value=document.createElement('strong');key.className='key';key.style.background=color;value.textContent=values[step].toFixed(3)+' '+data.unit;span.append(key,label,value);el('readout').append(span)});svg+=`<line x1="${X(step)}" x2="${X(step)}" y1="20" y2="183" stroke="#bcbcbc" stroke-dasharray="3 4"/>`;el('chart').innerHTML=svg;el('chart').setAttribute('aria-label',data.title+' at '+data.labels[step]);}
function tick(){if(step>=n-1){stop();el('status').textContent='Replay complete. Reset or scrub to inspect a step.';return}step++;draw();timer=setTimeout(tick,Number(el('speed').value))}
el('play').onclick=()=>{if(timer){stop();el('status').textContent='Paused at '+data.labels[step];return}if(el('reduce').checked){el('status').textContent='Reduced motion is on. Use the timeline to inspect individual steps.';return}if(step===n-1)step=0;draw();el('play').textContent='Pause';el('play').setAttribute('aria-pressed','true');el('status').textContent='Playing supplied data — no new observations or predictions are being generated.';timer=setTimeout(tick,Number(el('speed').value))};el('reset').onclick=()=>{stop();step=0;draw();el('status').textContent='Reset. Paused at the first step.'};el('scrub').oninput=e=>{stop();step=Number(e.target.value);draw();el('status').textContent='Paused at '+data.labels[step]};el('reduce').onchange=()=>{stop();el('status').textContent=el('reduce').checked?'Reduced motion on. Manual timeline remains available.':'Reduced motion off. Playback remains paused.'};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});draw();
</script></html>
